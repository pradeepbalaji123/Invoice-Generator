global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Scrapes Spring Boot 3 Micrometer Actuator Metrics
  - job_name: 'spring-boot-actuator'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 3s
    static_configs:
      - targets: ['backend:8080']
        labels:
          application: 'invoice-pro-backend'
          environment: 'production'

  # Scrapes Prometheus internal health
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
