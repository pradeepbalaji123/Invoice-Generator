---
- name: Install PostgreSQL server and contrib packages
  apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present

- name: Start and enable PostgreSQL service
  systemd:
    name: postgresql
    state: started
    enabled: yes

- name: Create PostgreSQL application database
  become_user: postgres
  postgresql_db:
    name: "{{ db_name }}"
    state: present

- name: Create PostgreSQL application user with strong password
  become_user: postgres
  postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    encrypted: yes
    state: present

- name: Grant all privileges on database to application user
  become_user: postgres
  postgresql_privs:
    db: "{{ db_name }}"
    role: "{{ db_user }}"
    privs: ALL
    type: database
