---
- name: Install Nginx web server
  apt:
    name: nginx
    state: present

- name: Create webroot directory for React frontend
  file:
    path: "/var/www/invoice-pro-frontend"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Deploy React frontend production build artifacts
  synchronize:
    src: "{{ playbook_dir }}/../../frontend/dist/"
    dest: "/var/www/invoice-pro-frontend/"
    delete: yes
    recursive: yes

- name: Configure Nginx virtual host configuration
  copy:
    dest: "/etc/nginx/sites-available/invoice-pro"
    content: |
      server {
          listen 80;
          server_name _;

          root /var/www/invoice-pro-frontend;
          index index.html;

          # React SPA routing
          location / {
              try_files $uri $uri/ /index.html;
          }

          # Reverse proxy to Spring Boot Backend API
          location /api/ {
              proxy_pass http://localhost:8080/api/;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection 'upgrade';
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_cache_bypass $http_upgrade;
          }

          # Reverse proxy to Spring Boot Actuator metrics
          location /actuator/ {
              proxy_pass http://localhost:8080/actuator/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
          }
      }
    mode: '0644'

- name: Enable invoice-pro Nginx site configuration
  file:
    src: "/etc/nginx/sites-available/invoice-pro"
    dest: "/etc/nginx/sites-enabled/invoice-pro"
    state: link

- name: Remove default Nginx site configuration
  file:
    path: "/etc/nginx/sites-enabled/default"
    state: absent

- name: Test and restart Nginx service
  systemd:
    name: nginx
    state: restarted
    enabled: yes
